<!DOCTYPE html>
<html>
<head>
<title>Ella Fashion - Ghana</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; margin:0; background:#fff8f5;}
header{background:black; color:white; padding:15px; text-align:center;}
.products{display:grid; grid-template-columns:repeat(2,1fr); gap:15px; padding:15px;}
.card{background:white; border-radius:12px; padding:10px; box-shadow:0 2px 8px #ccc; text-align:center;}
.card img{width:100%; border-radius:10px; height:180px; object-fit:cover;}
button{background:black; color:white; padding:8px 15px; border:none; border-radius:20px; cursor:pointer;}
button:hover{background:#ff3b6e;}
</style>
</head>
<body>
<header>
<h1>ELLA FASHION GH</h1>
<p>Trendy Dresses & More | Kumasi</p>
</header>

<div class="products">
<div class="card">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f">
<h3>Summer Dress</h3>
<p>GH₵ 150</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1">
<h3>African Print</h3>
<p>GH₵ 200</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1485230895905-ec40ba36b9bc">
<h3>Casual Wear</h3>
<p>GH₵ 120</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03">
<h3>Party Gown</h3>
<p>GH₵ 250</p>
<button>Add to Cart</button>
</div>
</div>
</body>
</html>
